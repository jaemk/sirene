name: docs

# Pages source is GitHub Actions. Renders the examples and the landing page's diagram with
# sirene, builds the mdBook, and deploys on changes to the docs or examples.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MDBOOK_VERSION: '0.5.3'
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml selects the channel and components.
      - run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build sirene
        run: cargo build --locked --release -p sirene --no-default-features
      - name: Render diagrams
        run: |
          sirene=target/release/sirene
          "$sirene" svg --theme dark examples -o docs/src/examples
          "$sirene" svg --theme dark docs/landing/hero.mmd -o docs/landing/hero.svg
          "$sirene" ascii docs/landing/hero.mmd > docs/landing/hero.txt
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        run: mdbook build docs
      - name: Assemble site
        # Landing page at the root, mdBook docs under /guide/.
        run: |
          mkdir -p _site/guide
          cp -r docs/landing/. _site/
          cp -r docs/book/. _site/guide/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # Pages sometimes fails the first status poll with "Deployment failed, try again later".
      # Retry once after a pause; a persistent failure still fails the retry.
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
