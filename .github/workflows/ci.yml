name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new advisory against an unchanged tree shows up before a release.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu pinned like release.yml, so a runner image change can't move the apt packages.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          libfontconfig1-dev libfreetype-dev libvulkan-dev
      # rust-toolchain.toml selects the channel and components.
      - run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-llvm-cov
      - run: bash scripts/ci.sh

  # RustSec advisory scan of Cargo.lock; ignores are in .cargo/audit.toml.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-audit
      - run: cargo audit
