[package]
name = "wasm-smoke"
description = "Renders sirene's examples on wasm32-unknown-unknown (WORKSP-11)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Run on wasm32-unknown-unknown by scripts/wasm-smoke.mjs, not by `cargo test`.
[[bin]]
name = "wasm-smoke"
path = "src/main.rs"
test = false

[dependencies]
sirene-core = { workspace = true, features = ["png"] }

[lints]
workspace = true
