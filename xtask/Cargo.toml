[package]
name = "xtask"
description = "Packaging tasks for sirene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.3.4"
icns = { version = "0.5.0", default-features = false, features = ["pngio"] }
plist = "1.10.3"
resvg = { version = "0.46.0", default-features = false }
# Release archive signatures that `self_update`'s `signatures` feature verifies.
zipsign-api = { version = "0.2.2", default-features = false, features = ["sign-tar"] }

[dev-dependencies]
assert_cmd = "2.2.2"
flate2 = "1"
predicates = "3.1.4"
# The verification `sirene update` runs, to check what `sign` writes.
self_update = { version = "1.3", default-features = false, features = [
    "ureq",
    "rustls",
    "signatures",
    "compression-tar-gz",
] }
tempfile = "3.27.0"

[lints]
workspace = true
