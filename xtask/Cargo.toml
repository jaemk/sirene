[package]
name = "xtask"
description = "Packaging tasks for sirene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
icns = { version = "0.5.0", default-features = false, features = ["pngio"] }
plist = "1.10.3"
resvg = { version = "0.49.0", default-features = false }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints]
workspace = true
