[package]
name = "sirene-core"
description = "Mermaid parsing, diagram model, and layout for sirene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mermaid", "diagram", "flowchart", "parser", "layout"]
categories = ["parser-implementations", "visualization"]

[lints]
workspace = true

[features]
## PNG output (`scene::png`), with an embedded font.
png = ["dep:resvg", "dep:ttf-parser"]

[dependencies]
log = "0.4.35"
resvg = { version = "0.46.0", default-features = false, features = ["text"], optional = true }
rowan = "0.17.0"
ttf-parser = { version = "0.25.1", optional = true }
unicode-width = "0.2.3"

[[test]]
name = "png"
required-features = ["png"]

[[test]]
name = "examples"
required-features = ["png"]

[dev-dependencies]
insta = "1.49.0"
proptest = "1.11.0"
