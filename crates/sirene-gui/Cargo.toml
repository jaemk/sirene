[package]
name = "sirene-gui"
description = "gpui viewer and editor for sirene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mermaid", "diagram", "gpui", "editor"]
categories = ["gui", "visualization"]

[dependencies]
anyhow = "1"
futures = "0.3"
# GPUI Kit: gpui-pre, its platform, gpui-base, and gpui-component, under one name.
gpui = { package = "gpui-kit", version = "=0.9.0" }
log = "0.4.35"
sirene-core = { workspace = true, features = ["png"] }

[dev-dependencies]
gpui = { package = "gpui-kit", version = "=0.9.0", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
