[package]
name = "sirene"
description = "Mermaid, PlantUML, and Graphviz DOT diagram editor and viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "sirene"
path = "src/main.rs"

[features]
default = ["gui"]
## The viewer window; without it the binary is CLI only.
gui = ["dep:sirene-gui"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
log = { version = "0.4.35", features = ["std"] }
semver = "1"
tempfile = "3.27.0"
# `sirene update` (UPDATE-1): GitHub releases over ureq and rustls, which builds for musl;
# `native-certs` trusts the system's certificate store, for proxies that re-sign HTTPS.
self_update = { version = "1.3", default-features = false, features = [
    "ureq",
    "rustls",
    "native-certs",
    "github",
    "progress-bar",
    "compression-tar-gz",
    "checksums",
    "signatures",
] }
sirene-core = { workspace = true, features = ["png"] }
sirene-gui = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
