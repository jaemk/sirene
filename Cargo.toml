[workspace]
resolver = "3"
members = ["crates/*", "xtask", "wasm"]

[workspace.package]
version = "0.8.1-dev"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jaemk/sirene"
homepage = "https://github.com/jaemk/sirene"
keywords = ["mermaid", "diagram", "flowchart", "ascii", "editor"]
categories = ["command-line-utilities", "visualization", "gui"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `sirene-wasm` as the docs site loads it (pages.yml): small over fast.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
sirene-core = { path = "crates/sirene-core", version = "0.8.1-dev" }
sirene-gui = { path = "crates/sirene-gui", version = "0.8.1-dev" }
