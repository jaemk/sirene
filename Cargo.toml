[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jaemk/sirene"
homepage = "https://github.com/jaemk/sirene"
keywords = ["mermaid", "diagram", "flowchart", "ascii", "editor"]
categories = ["command-line-utilities", "visualization", "gui"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
sirene-core = { path = "crates/sirene-core", version = "0.1.1" }
sirene-gui = { path = "crates/sirene-gui", version = "0.1.1" }
